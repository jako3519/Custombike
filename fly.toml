# Fly.io-opsætning for Custombike.
# App-navnet skal være unikt på Fly.io – ret det, hvis det er optaget.
# Opret appen selv (`fly apps create custombike`). Denne fil deployer ikke noget af sig selv.
app = "custombike"
primary_region = "ams"   # Amsterdam – tættest på Danmark

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Siden kører altid, så besøgende aldrig venter på at den vågner
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/texts"
    timeout = "5s"

# Uploadede billeder gemmes på et volume, så de overlever deploys
[[mounts]]
  source = "gallery"
  destination = "/app/wwwroot/gallery"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
